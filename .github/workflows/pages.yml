name: Deploy WakeMove website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /WakeMove
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build static website
        working-directory: website
        run: npx next build

      - name: Add verified APK mirror
        shell: bash
        run: |
          VERSION_NAME=$(node -p "require('./website/public/update.json').versionName")
          DOWNLOAD_URL=$(node -p "require('./website/public/update.json').downloadUrl")
          EXPECTED_SHA=$(node -p "require('./website/public/update.json').sha256")
          APK_PATH="website/out/downloads/WakeMove-v${VERSION_NAME}.apk"
          mkdir -p "$(dirname "$APK_PATH")"
          curl --fail --location --retry 3 --retry-delay 3 --output "$APK_PATH" "$DOWNLOAD_URL"
          echo "${EXPECTED_SHA}  ${APK_PATH}" | sha256sum --check --strict

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
